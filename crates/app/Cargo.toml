[package]
name = "clipforge-app"
description = "ClipForge desktop application (Slint UI)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "clipforge"
path = "src/main.rs"

[dependencies]
clipforge-core.workspace = true
clipforge-i18n.workspace = true
clipforge-platform.workspace = true
clipforge-library.workspace = true
clipforge-media.workspace = true
clipforge-jobs.workspace = true
clipforge-render.workspace = true
clipforge-export.workspace = true
crossbeam-channel.workspace = true
rfd.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
slint.workspace = true
i-slint-backend-winit.workspace = true
winit.workspace = true

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# cargo-packager (https://docs.crabnebula.dev/packager/) configuration.
[package.metadata.packager]
product-name = "ClipForge"
identifier = "dev.clipforge.app"
description = "Turn your photos and videos into a slideshow."
category = "Video"
icons = ["../../assets/icons/icon.icns", "../../assets/icons/icon.ico", "../../assets/icons/*.png"]
out-dir = "../../dist"
before-packaging-command = ""

# Formats are passed on the command line per OS (see .github/workflows/ci.yml):
#   macOS:   cargo packager --release -p clipforge-app --formats app,dmg
#   Windows: cargo packager --release -p clipforge-app --formats nsis

[package.metadata.packager.macos]
minimum-system-version = "14.0"
# Ad-hoc signature: seals the bundle so macOS does not report it as damaged.
# Replace with a Developer ID identity (and notarize) for real distribution.
signing-identity = "-"

[package.metadata.packager.nsis]
installer-mode = "currentUser"
display-language-selector = true
languages = ["English", "German"]
