name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-about
      - name: Format
        run: cargo fmt --all --check
      # Tests first: they need full codegen of every dependency and that
      # build is what the cache keeps. Clippy afterwards only adds rmeta.
      - name: Tests
        run: cargo nextest run --workspace --cargo-profile ci
      - name: Doc tests
        run: cargo test --workspace --doc --profile ci
      - name: Clippy
        run: cargo clippy --workspace --all-targets --profile ci -- -D warnings
      - name: Dependency direction and fixtures
        run: |
          cargo run --quiet --profile ci -p xtask -- check-deps
          cargo run --quiet --profile ci -p xtask -- fixtures --verify
      - name: Licences and advisories
        run: cargo deny check
      - name: Third-party licence report
        run: cargo about generate about.hbs -o target/THIRD_PARTY_LICENSES.html
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses-${{ matrix.os }}
          path: target/THIRD_PARTY_LICENSES.html

  package:
    name: package (${{ matrix.os }})
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            formats: app,dmg
          - os: windows-latest
            formats: nsis
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: package
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager
      - name: Build release binary
        run: cargo build --release -p clipforge-app
      - name: Package
        run: cargo packager --release -p clipforge-app --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: clipforge-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.app.tar.gz
            dist/*.exe
            dist/*.msi
          if-no-files-found: error
