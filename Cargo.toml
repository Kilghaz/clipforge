[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
repository = "https://github.com/Kilghaz/clipforge"

[workspace.dependencies]
clipforge-core = { path = "crates/core" }
clipforge-media = { path = "crates/media" }
clipforge-library = { path = "crates/library" }
clipforge-render = { path = "crates/render" }
clipforge-export = { path = "crates/export" }
clipforge-jobs = { path = "crates/jobs" }
clipforge-platform = { path = "crates/platform" }
clipforge-i18n = { path = "crates/i18n" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
sys-locale = "0.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
proptest = "1"
tempfile = "3"
cargo_metadata = "0.23"
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
crossbeam-channel = "0.5"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp"] }
fast_image_resize = { version = "6", features = ["image"] }
kamadak-exif = "0.6"
rfd = { version = "0.17", default-features = false }
cpal = "0.18"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-femtovg", "software-renderer-systemfonts"] }
slint-build = "1.18"
i-slint-backend-winit = { version = "1.18", default-features = false, features = ["renderer-femtovg", "accessibility"] }
winit = { version = "0.30", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

# Local development: optimise dependencies (image decoding, hashing) so the
# debug app is usable, keep our own crates fast to compile.
[profile.dev.package."*"]
opt-level = 2

# CI: no dependency optimisation, no debug info. Cuts cold compile time
# roughly in half; used by clippy and tests in .github/workflows/ci.yml.
[profile.ci]
inherits = "dev"
debug = 0
strip = "debuginfo"
incremental = false

[profile.ci.package."*"]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
