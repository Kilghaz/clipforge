# cargo-about configuration: generates the third-party licence report.
# Run: cargo about generate about.hbs -o target/THIRD_PARTY_LICENSES.html
accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "LicenseRef-Slint-Royalty-free-2.0",
]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
private = { ignore = true }

[slint]
accepted = ["LicenseRef-Slint-Royalty-free-2.0"]
